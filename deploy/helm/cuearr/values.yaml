nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/marcatos/cuearr
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8787

persistence:
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  watch:
    enabled: true
    # hostPath: mount a node directory (typical with hostPath volumes for media libraries).
    # DirectoryOrCreate paths are root-owned; enable hostPathOwnershipInit below so UID 1000 can write.
    # pvc: request a PersistentVolumeClaim (fsGroup applies; no init container needed)
    mode: hostPath
    mountPath: /watch
    hostPath: /srv/cuearr/watch
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  out:
    enabled: true
    mode: hostPath
    mountPath: /out
    hostPath: /srv/cuearr/out
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""

auth:
  # Use an existing Secret instead of creating one (keys: see templates/secret.yaml).
  existingSecret: ""
  initialPassword: ""
  apiKey: ""

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""
  allowedEmailDomains: ""

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

# When watch/out use hostPath, fsGroup does not fix node directory ownership.
# This init container chowns those mount paths to runAsUser/runAsGroup before cuearr starts.
hostPathOwnershipInit:
  enabled: true
  image: busybox:1.36.1

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
