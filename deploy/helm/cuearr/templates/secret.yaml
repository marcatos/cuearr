{{- if not .Values.auth.existingSecret }}
{{- $hasAuth := or .Values.auth.initialPassword .Values.auth.apiKey .Values.oidc.enabled .Values.oidc.issuer .Values.oidc.clientId .Values.oidc.clientSecret .Values.oidc.redirectUrl .Values.oidc.allowedEmailDomains }}
{{- if $hasAuth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cuearr.fullname" . }}
  labels:
    {{- include "cuearr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.initialPassword }}
  CUEARR_INITIAL_PASSWORD: {{ .Values.auth.initialPassword | quote }}
  {{- end }}
  {{- if .Values.auth.apiKey }}
  CUEARR_API_KEY: {{ .Values.auth.apiKey | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  CUEARR_OIDC_ENABLED: "true"
  {{- end }}
  {{- if .Values.oidc.issuer }}
  CUEARR_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  {{- if .Values.oidc.clientId }}
  CUEARR_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  {{- end }}
  {{- if .Values.oidc.clientSecret }}
  CUEARR_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oidc.redirectUrl }}
  CUEARR_OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  {{- end }}
  {{- if .Values.oidc.allowedEmailDomains }}
  CUEARR_OIDC_ALLOWED_EMAIL_DOMAINS: {{ .Values.oidc.allowedEmailDomains | quote }}
  {{- end }}
{{- end }}
{{- end }}
