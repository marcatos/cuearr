name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shntool cuetools flac sox ffmpeg
      - name: Generate synthetic split fixture
        run: |
          rm -rf testdata/e2e_album testdata/e2e_album_wav
          bash scripts/generate_fixture.sh
          bash scripts/generate_fixture.sh testdata/e2e_album_wav wav
      - name: Test
        run: go test ./...
        env:
          CUEARR_REQUIRE_SHNTOOL: "1"
      - run: go build -o dist/cuearr ./cmd/cuearr
