name: Docker smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUEARR_INITIAL_PASSWORD: smoke-test-password
      CUEARR_API_KEY: smoke-test-api-key
      CUEARR_URL: http://127.0.0.1:8787
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker
        id: docker
        working-directory: .
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no Docker on self-hosted)
        if: steps.docker.outputs.available != 'true' && runner.environment == 'self-hosted'
        run: echo "Docker unavailable on self-hosted runner; skipping smoke."

      - name: Install fixture tools
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Prepare watch/out
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        run: mkdir -p watch out

      - name: Compose up
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        run: docker compose up -d --build

      - name: Wait for health
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        working-directory: .
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS "${CUEARR_URL}/api/v1/health" -o /tmp/health.json; then
              ok="$(jq -e '.ok == true and .sqlite_ok == true' /tmp/health.json >/dev/null && echo yes || echo no)"
              shntool="$(jq -e '.shntool_ok == true' /tmp/health.json >/dev/null && echo yes || echo no)"
              if [[ "$ok" == yes && "$shntool" == yes ]]; then
                echo "Health OK after ${i} attempt(s)"
                cat /tmp/health.json
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Health check failed or timed out" >&2
          exit 1

      - name: Generate fixture into watch
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        working-directory: .
        run: bash scripts/generate_fixture.sh deploy/docker/watch/smoke_album

      - name: Wait for completed job
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        working-directory: .
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            curl -fsS -H "X-Api-Key: ${CUEARR_API_KEY}" \
              "${CUEARR_URL}/api/v1/jobs?limit=20" -o /tmp/jobs.json
            status="$(jq -r '
              if ([.jobs[].status] | index("completed")) then "completed"
              elif ([.jobs[].status] | index("failed")) then "failed"
              else empty end' /tmp/jobs.json)"
            if [[ "$status" == "completed" ]]; then
              echo "Job completed"
              jq '.jobs[] | select(.status == "completed") | {id, status, cue_path, out_dir}' /tmp/jobs.json
              exit 0
            fi
            if [[ "$status" == "failed" ]]; then
              echo "Job failed:" >&2
              jq '.jobs[] | select(.status == "failed")' /tmp/jobs.json >&2
              exit 1
            fi
            sleep 3
          done
          echo "Timed out waiting for completed job" >&2
          cat /tmp/jobs.json >&2 || true
          exit 1

      - name: Verify output FLACs
        if: steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted'
        run: |
          set -euo pipefail
          count="$(find out -name '*.flac' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$count" -lt 2 ]]; then
            echo "Expected at least 2 FLAC files under out/, found $count" >&2
            find out -type f || true
            exit 1
          fi
          echo "Found $count FLAC file(s) under out/"

      - name: Collect logs on failure
        if: failure() && (steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted')
        run: docker compose logs --no-color > /tmp/cuearr-compose.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure() && (steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted')
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-failure
          path: |
            /tmp/cuearr-compose.log
            /tmp/health.json
            /tmp/jobs.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Compose down
        if: always() && (steps.docker.outputs.available == 'true' || runner.environment != 'self-hosted')
        run: docker compose down -v
