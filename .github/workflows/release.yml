name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
          - goos: windows
            goarch: amd64
            name: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="cuearr-${VERSION}-${{ matrix.name }}"
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags="-s -w -X main.version=${VERSION}" -o "${out}.exe" ./cmd/cuearr
            zip -j "${out}.zip" "${out}.exe"
            rm "${out}.exe"
            echo "asset=${out}.zip" >> "$GITHUB_OUTPUT"
          else
            go build -ldflags="-s -w -X main.version=${VERSION}" -o "${out}" ./cmd/cuearr
            tar -czf "${out}.tar.gz" "${out}"
            rm "${out}"
            echo "asset=${out}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.build.outputs.asset }}
          retention-days: 7

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/marcatos/cuearr:${{ github.ref_name }}
            ghcr.io/marcatos/cuearr:latest
